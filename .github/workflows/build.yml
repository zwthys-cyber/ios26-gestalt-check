name: Verify and build iOS packages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify non-mutating file permission inspection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          xcodebuild -version | tee dist/toolchain.txt
          swiftc Erosion/Tweaks/MobileGestalt/MGPermissionInspection.swift tests/PermissionInspectionTests.swift -o "$RUNNER_TEMP/permission-tests"
          "$RUNNER_TEMP/permission-tests" | tee dist/permission-tests.txt
      - name: Verify fixed-target container checks with mock APIs
        shell: bash
        run: |
          set -euo pipefail
          clang -fobjc-arc -fblocks -framework Foundation tests/ContainerAccessCheckTests.m -o "$RUNNER_TEMP/container-tests"
          "$RUNNER_TEMP/container-tests" | tee dist/container-tests.txt
      - name: Verify post-OTA query decision and cleanup flow
        shell: bash
        run: |
          set -euo pipefail
          swiftc Erosion/Tweaks/MobileGestalt/MGPermissionInspection.swift Erosion/Tweaks/MobileGestalt/MGWorseQueryCheck.swift tests/WorseQueryCheckTests.swift -o "$RUNNER_TEMP/worse-query-check-tests"
          "$RUNNER_TEMP/worse-query-check-tests" | tee dist/worse-query-check-tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Verification-results
          path: dist/
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        app: [Erosion-Check, GestaltX]
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build package on GitHub macOS runner
        env:
          BUILD_APP: ${{ matrix.app }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          xcodebuild -version | tee dist/toolchain.txt
          bash scripts/build-cloud.sh "$BUILD_APP" 2>&1 | tee dist/build.log
      - name: Verify packaged binary and App Group entitlements
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-ipa.py dist/*.ipa | tee dist/package-verification.json
          shasum -a 256 dist/*.ipa > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.app }}-IPA
          path: dist/
          retention-days: 30
